<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion – TechPro Admin</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>TechPro Admin</h1>
      <p>Connectez-vous pour accéder au tableau de bord</p>
    </div>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">Identifiant ou email</label>
        <input id="username" type="text" placeholder="admin ou admin@system.com" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" placeholder="Votre mot de passe" required>
      </div>
      <p id="loginError" class="error-msg"></p>
      <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
    </form>
  </div>
  <div id="forcePasswordModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h2>Changement de mot de passe requis</h2>
      <p class="text-muted">Vous utilisez le mot de passe par défaut. Veuillez le changer avant de continuer.</p>
      <form id="forcePasswordForm" class="modal-form">
        <div class="form-group">
          <label for="fp-current">Mot de passe actuel</label>
          <input id="fp-current" type="password" value="ChangeMe123" readonly class="input-readonly">
        </div>
        <div class="form-group">
          <label for="fp-new">Nouveau mot de passe</label>
          <input id="fp-new" type="password" placeholder="Au moins 6 caractères" required>
        </div>
        <div class="form-group">
          <label for="fp-confirm">Confirmer le mot de passe</label>
          <input id="fp-confirm" type="password" placeholder="Répétez le mot de passe" required>
        </div>
        <p id="fpError" class="error-msg"></p>
        <button type="submit" class="btn btn-primary btn-full">Changer et continuer</button>
      </form>
    </div>
  </div>

  <script>
    let currentAdmin = null;
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          loginError.textContent = data.error || 'Erreur de connexion';
          return;
        }
        currentAdmin = data.admin;
        if (data.forcePasswordChange) {
          document.getElementById('forcePasswordModal').style.display = 'flex';
        } else {
          window.location.href = '/admin/dashboard.html';
        }
      } catch {
        loginError.textContent = 'Erreur réseau';
      }
    });

    document.getElementById('forcePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fpError = document.getElementById('fpError');
      fpError.textContent = '';
      const newPwd = document.getElementById('fp-new').value;
      const confirmPwd = document.getElementById('fp-confirm').value;

      if (newPwd !== confirmPwd) {
        fpError.textContent = 'Les mots de passe ne correspondent pas';
        return;
      }
      if (newPwd.length < 6) {
        fpError.textContent = 'Minimum 6 caractères';
        return;
      }

      try {
        const res = await fetch('/api/admin/settings', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: 'ChangeMe123', newPassword: newPwd }),
        });
        const data = await res.json();
        if (!res.ok) {
          fpError.textContent = data.error || 'Erreur';
          return;
        }
        window.location.href = '/admin/dashboard.html';
      } catch {
        fpError.textContent = 'Erreur réseau';
      }
    });
  </script>
</body>
</html>
